[build]
  command = "npm ci && rm -rf .next/cache && npm run build"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_DEPLOY_ID = "$DEPLOY_ID"
  SECRETS_SCAN_OMIT_PATHS = "scripts/"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Scheduled Functions ───────────────────────────────────────────────────────
# 11:45 PM ET — pull yesterday's GC route-days + rebuild driver profiles
[functions."cron-sync-gc"]
  schedule = "45 3 * * *"

# 5:30 AM ET — assign drivers to their routes in GroundCloud
[functions."cron-assign-gc-drivers"]
  schedule = "30 9 * * *"

# 11:30 PM ET — push default route template to DRO and trigger solve
[functions."cron-push-dro-routes"]
  schedule = "30 3 * * *"

# 6:00 AM ET — scrape Daily Service Worksheet from MyBizAccount
[functions."cron-sync-dsw"]
  schedule = "0 10 * * *"
